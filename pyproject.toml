[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evsite"
version = "0.1.0"
description = "OSM/OpenChargeMap tiling and rasterization pipeline for EV charging site suitability CNN"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
